openapi: 3.1.0
info:
  title: AstroMap-AI Public API
  version: 0.1.0
paths:
  /health/ready:
    get:
      operationId: readiness
      responses:
        "200": {description: Service is ready}
  /api/v1/targets:
    get:
      operationId: searchTargets
      parameters:
        - {name: ra, in: query, schema: {type: number, minimum: 0, maximum: 360}}
        - {name: dec, in: query, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: radius_deg, in: query, schema: {type: number, minimum: 0, maximum: 180}}
        - {name: min_score, in: query, schema: {type: number, minimum: 0, maximum: 1}}
      responses:
        "200": {description: Matching targets}
  /api/v1/targets/{tic_id}:
    get:
      operationId: getTarget
      parameters:
        - {name: tic_id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200": {description: Target details}
        "404": {description: Target not found}
  /api/v1/analyses/{tic_id}:
    post:
      operationId: analyzeTarget
      parameters:
        - {name: tic_id, in: path, required: true, schema: {type: integer, minimum: 1}}
        - {name: sector, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200": {description: Completed real SPOC analysis}
        "503": {description: Inference service unavailable}
  /api/v1/targets/{tic_id}/observations:
    get:
      operationId: listTargetObservations
      parameters:
        - {name: tic_id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200": {description: Preferred SPOC product for each available TESS sector}
        "502": {description: MAST observation query failed}