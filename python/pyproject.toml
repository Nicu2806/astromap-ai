[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astromap-ai"
version = "0.1.0"
description = "Scientific pipeline and inference service for AstroMap-AI"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.2",
  "pydantic>=2.6",
  "astropy>=6.0",
  "lightkurve>=2.5",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
data = ["pandas>=2.2", "pyarrow>=16"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
astromap-infer = "astromap.cli:main"
astromap-train = "astromap.training:main"
astromap-report = "astromap.reporting:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
